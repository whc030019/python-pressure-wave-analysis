[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pressure-wave-analysis"
version = "0.1.0"
description = "Educational pressure-time CSV analysis and visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4"]
license = "MIT"

[project.scripts]
pressure-analyze = "pressure_wave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
